[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qshield-sdk"
version = "0.1.0"
description = "Device-local quantum-resistant file encryption prototype for Python applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=50.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
demo = ["streamlit>=1.35", "supabase"]

[project.scripts]
qshield-local = "qshield_local:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["qshield_sdk", "qshield_local"]
